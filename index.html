          ['cancelled','Withdrawn by the requester','terminal']
        ]},
        { t:'callout', variant:'note', title:'Why the state machine matters', text:'Without explicit states, "is this request still active?" becomes a scattered set of conditions across the codebase. With states, it is one column and one transition table.' }
      ]},
      { id:'matching', title:'Matching logic', blocks:[
        { t:'p', text:'Compatibility is not simply "same blood group." A recipient with AB+ can receive from any group; a recipient with O− can only receive from O−. Encode compatibility as data, not as a chain of if-statements.' },
        { t:'code', lang:'sql', filename:'compatibility as a table', code:
`CREATE TABLE blood_compatibility (
  recipient_group CHAR(3) NOT NULL,
  donor_group     CHAR(3) NOT NULL,
  PRIMARY KEY (recipient_group, donor_group)
) ENGINE=InnoDB;

-- Populated with the standard red blood cell compatibility matrix.

SELECT d.user_id, d.blood_group, d.city
FROM donations_request r
JOIN donor_profiles d
  ON d.blood_group IN (
       SELECT donor_group FROM blood_compatibility
       WHERE recipient_group = r.blood_group)
 AND d.city = r.city
 AND d.is_available = 1
 AND (d.last_donation_date IS NULL
      OR d.last_donation_date <= DATE_SUB(CURDATE(), INTERVAL 90 DAY))
WHERE r.id = ? AND r.status = 'open';` },
        { t:'p', text:'The 90-day interval is a real eligibility constraint, not decoration. Being able to explain why it is there — and why it belongs in the query rather than in the UI — is worth more in a viva than any additional feature.' }
      ]},
      { id:'privacy', title:'Contact privacy design', blocks:[
        { t:'p', text:'This is the section most student implementations get wrong. The rule: no phone number or email is ever present in a page response or API payload unless the requesting user is a party to a confirmed match.' },
        { t:'ul', items:[
          'The public request page shows the requester\'s city and urgency, and a "Respond" button — never a phone number.',
          'A donor who responds creates a match row. Only then is contact information visible, and only to the requester and that specific donor.',
          'Contact details are fetched through an authorisation-checked endpoint, never embedded in the page HTML and hidden with CSS.',
          'Every contact reveal is logged with the user ID and timestamp.'
        ]},
        { t:'callout', variant:'warn', title:'The CSS-hiding mistake', text:'Hiding a phone number with display:none still ships it to the browser. Anyone can read the page source. If the number is in the response, it is public.' }
      ]},
      { id:'testing', title:'Testing checklist', blocks:[
        { t:'ul', items:[
          'An O− recipient is matched with O− donors only, never with O+.',
          'A donor whose last donation was 30 days ago does not appear in matches.',
          'A request past its required-by date transitions to expired on the next scheduled job and stops matching.',
          'Two donors responding to the same request both create match rows; confirming one moves the request to fulfilled.',
          'A user who is not a party to a match cannot retrieve contact information by guessing the match ID.',
          'Cancelling a request removes it from all donor match lists.'
        ]}
      ]}
    ],
    viva:[
      { q:'Why store blood compatibility in a table rather than in code?',
        a:'Because it is reference data, not logic. If the rule changes or an edge case is corrected, the table is updated and every query benefits immediately.' },
      { q:'How do you prevent a donor\'s phone number from leaking?',
        a:'The number is never included in any page render or public API response. It is served only by an endpoint that checks whether the requesting user is the requester or the responding donor on a confirmed match.' },
      { q:'What is the role of the 90-day eligibility rule?',
        a:'It reflects the real minimum interval between whole-blood donations. In the system it is enforced in the matching query so ineligible donors are never surfaced, and again at the point of confirming a donation.' },
      { q:'Why model the request as a state machine?',
        a:'Because "is this request still active?" needs a single authoritative answer. Scattered boolean flags produce inconsistent behaviour. A state column with a defined transition table makes the rules explicit, testable, and explainable.' }
    ]
  },

        { t:'p', text:'PDF is not a text format. It is a page-description format with a coordinate system, embedded fonts, content streams, and an object graph. Attempting to "edit text in a PDF" the way you edit a Word document is the single most common reason this project fails.' },

        { t:'p', text:'Replacing existing text inside a PDF, changing embedded fonts, and editing the internal content stream. These require re-authoring the page content and are not a semester-scale problem.' },
        { t:'callout', variant:'note', title:'Choose the library deliberately', text:'In .NET, PdfPig and PDFsharp are common choices with different strengths. Pick one, document why, and be ready to explain its limitations.' }
      ]},
      { id:'architecture', title:'Architecture: model, service, view', blocks:[
        { t:'p', text:'The critical architectural decision is that the document model knows nothing about WPF, and the view knows nothing about the PDF library. A service layer translates between them.' },
        { t:'code', lang:'csharp', filename:'Document/DocumentModel.cs', code:
`namespace PdfEditMaster.Document;

public sealed class DocumentModel
{
    private readonly List<DocumentPage> _pages = new();

    public string? SourcePath { get; private set; }
    public IReadOnlyList<DocumentPage> Pages => _pages;

    public void Load(string path, IPdfReader reader)
    {
        _pages.Clear();
        SourcePath = path;

        using var handle = reader.Open(path);
        for (int i = 0; i < handle.PageCount; i++)
        {
            _pages.Add(new DocumentPage(
                index: i,
                sourcePath: path,
                widthPt: handle.GetPageWidth(i),
                heightPt: handle.GetPageHeight(i),
                rotation: handle.GetPageRotation(i)));
        }
    }

    public void Remove(int index)
    {
        if (_pages.Count == 1)
            throw new InvalidOperationException("A document must keep at least one page.");
        _pages.RemoveAt(index);
        Renumber();
    }

    private void Renumber()
    {
        for (int i = 0; i < _pages.Count; i++)
            _pages[i] = _pages[i] with { Index = i };
    }
}` },
        { t:'p', text:'The model is pure data plus rules. The rule "a document must keep at least one page" lives here, not in the UI, so it cannot be bypassed by a keyboard shortcut or a context menu action.' }
      ]},
      { id:'memory', title:'Memory-safe processing of large files', blocks:[
        { t:'p', text:'A 200-page scanned PDF can easily exceed 400 MB when fully decoded into bitmaps. If you decode every page at open time, the application will exhaust memory on the examiner\'s machine.' },
        { t:'ul', items:[
          'Render page thumbnails at low resolution (96–120 DPI) and cache a bounded number of them (an LRU cache of 20–30 pages).',
          'Render the full-resolution page on demand and release the previous one when navigating away.',
          'Never hold decoded bitmaps for pages the user is not viewing.',
          'Stream the save operation rather than building the entire output document in memory.',
          'Dispose every IDisposable from the PDF library explicitly.'
        ]}
      ]},
      { id:'testing', title:'Testing checklist', blocks:[
        { t:'ul', items:[
          'Open a 300-page PDF and confirm memory stays stable while scrolling through all pages.',
          'Attempt to delete the last remaining page — blocked with a clear message, not a crash.',
          'Reorder page 1 to position 5 and verify the exported PDF reflects the new order.',
          'Merge two documents with different page sizes and confirm output pages retain their original dimensions.',
          'Rotate a page 90° and verify the exported page is rotated, not just the preview.',
          'Open a corrupted or password-protected PDF and confirm the error is handled with a message.'
        ]},
        { t:'callout', variant:'warn', title:'The password-protected crash', text:'Nearly every submission of this project crashes when opening an encrypted PDF. Catch the library\'s specific exception at the open call and surface a message.' }
      ]}
    ],
    viva:[
      { q:'Why not allow the user to edit existing text in the PDF?',
        a:'PDF stores text as positioned glyphs drawn from embedded fonts inside content streams. There is no paragraph structure to edit. Changing the text means re-encoding the content stream, re-measuring glyph widths, and potentially embedding a new font subset.' },
      { q:'How does the application handle a 300-page document without running out of memory?',
        a:'Full-resolution bitmaps are never all held at once. Thumbnails are rendered at low DPI into a bounded LRU cache of roughly two dozen pages, and the full-resolution bitmap for the visible page is rendered on demand and released when the user navigates away.' },
      { q:'Why does the document model have no reference to WPF or the PDF library?',
        a:'So the rules can be tested and reused independently of the presentation layer. Page reordering, the minimum-one-page rule, and rotation state are pure domain logic.' },
      { q:'What happens if the user deletes every page?',
        a:'The model throws when the removal would leave the document empty, so the operation is rejected before any state changes.' }
    ]
  },

  { slug:'how-to-write-an-srs', title:'How to Write an SRS for a Software Project',
    categoryId:'project-documentation', category:'Project Documentation',
    excerpt:'Most SRS documents are written after the code, as a formality, and read like a feature list. This guide walks through the sections that actually constrain the design — and the ones that are usually missing.',

    sections:[
      { id:'why', title:'Why the SRS exists', blocks:[
        { t:'p', text:'An SRS has one job: to remove ambiguity about what you are building before you build it. If a requirement can be read two ways, the document has failed. If a requirement describes how the system is implemented rather than what it must do, the document has overstepped.' },
        { t:'p', text:'The most reliable test of an SRS is whether it can be used to produce a use-case diagram, a data model, and a test plan without adding new information. If you need to invent details during design that are not in the document, the document is incomplete.' }

      { id:'scope', title:'Section 1 — Scope and purpose', blocks:[
        { t:'p', text:'This section states what the system is, who it is for, and — critically — what it explicitly does not include. The exclusion list is not padding. It is the boundary that protects your schedule.' },

        { t:'ul', items:[
          'One paragraph describing the system in plain language, without technology names.',

      ]},
      { id:'requirements', title:'Section 3 — Functional requirements', blocks:[
        { t:'p', text:'Write each requirement as a single, testable sentence with a stable identifier. The identifier matters because you will reference it from your design diagrams, your test cases, and your report.' },
        { t:'code', lang:'text', filename:'requirement format', code:
`FR-01  The system shall allow a receptionist to register a new patient

FR-02  The system shall prevent two appointments from being booked for

          { key:'yes', title:'Yes, this is central to the project', desc:'Classification, prediction, image processing, or data analysis.' },
          { key:'no', title:'No, it is CRUD and business logic', desc:'The project is mostly create, read, update, delete, and rules.' }
        ]},
      { id:'experience', q:'What are you most comfortable with right now?', hint:'Be honest. Choosing a stack you do not know converts learning time into schedule risk.',
        options:[
          { key:'php', title:'PHP and MySQL', desc:'You have built at least one working PHP application.' },
          { key:'python', title:'Python', desc:'You are comfortable with Python and standard libraries.' },
          { key:'js', title:'JavaScript / TypeScript', desc:'You are comfortable with modern JavaScript.' },
          { key:'csharp', title:'C# / .NET', desc:'You are comfortable with C# and the .NET ecosystem.' },
          { key:'java', title:'Java', desc:'You are comfortable with Java and its tooling.' },
          { key:'new', title:'None of these deeply', desc:'You are still building foundational skills.' }
        ]}
    ],
    recommend(answers){
      const {interface:i, realtime:rt, hardware:hw, data:dt, experience:exp} = answers;
      if (i === 'desktop') {
        const stack = exp === 'java' ? 'Java + JavaFX' : exp === 'python' ? 'Python + PyQt' : 'C# + WPF';
        return { title: stack, why:'Desktop applications need a language and UI toolkit with first-class native support. ' + stack + ' gives you that without forcing a browser runtime into a desktop shape.', alts:['Java + JavaFX if JVM deployment is required','Python + PyQt for embedded Python analysis','Avoid Electron wrappers unless the browser runtime is genuinely required'] };
      }
      if (i === 'mobile') {
        const stack = exp === 'csharp' ? 'C# + .NET MAUI' : 'Kotlin + Jetpack Compose (Android)';
        return { title: stack, why:'Native mobile gives you access to device capabilities, background services, and offline storage that a mobile web app cannot fully use.', alts:['Flutter for one codebase across iOS and Android','React Native if you know React well','Choose native only if you genuinely need hardware or background work'] };
      }
      if (rt === 'yes') {
        return { title: 'Node.js + Express + WebSockets', why:'Real-time features need a server that handles many concurrent connections efficiently.', alts:['Django Channels if you prefer Python','Laravel + Pusher if committed to PHP','Polling is not real-time and will not satisfy a real-time requirement'] };
      }
      if (dt === 'yes') {
        return { title: 'Python + Flask + scikit-learn (or PyTorch)', why:'Data and ML work belongs in Python. Flask keeps the web layer thin so the substance of the project remains the focus.', alts:['Django for substantial admin interface','FastAPI if the project is primarily an API','Avoid ML in JavaScript unless it must run in the browser'] };
      }
      if (hw === 'yes') {
        return { title: 'Web app + client-side bridge (or native companion)', why:'Browsers have limited hardware access. Plan for a PWA using specific APIs, or a small native companion.', alts:['PWA with File System Access, Geolocation, getUserMedia','Native desktop companion for unreachable hardware','Do not promise hardware in a web app without verifying the browser API exists'] };
      }
      if (exp === 'php' || exp === 'new') {
        return { title: 'PHP + MySQL (server-rendered)', why:'For a CRUD-heavy web project with authenticated roles, PHP and MySQL is the fastest route from requirements to a working system.', alts:['Laravel if you would otherwise rebuild auth, migrations, validation','Django is the equivalent Python option','Avoid SPAs unless the project has genuinely complex client state'] };
      }
      if (exp === 'python') {
        return { title: 'Python + Django (or Flask)', why:'Django gives you ORM, auth, migrations, and admin out of the box. Flask is lighter for fewer entities.', alts:['Flask for fewer than six entities and no back office','Laravel or plain PHP if you already know PHP','Node.js if frontend and backend share code'] };
      }
      if (exp === 'js') {
        return { title: 'Node.js + Express + templates (or React)', why:'One language across the stack keeps context switching low.', alts:['Next.js for server rendering and React together','Plain Express with EJS for CRUD simplicity','PHP or Django may be faster if learning from scratch'] };
      }
      if (exp === 'csharp') {
        return { title: 'C# + ASP.NET Core MVC', why:'Strongly typed, well-tooled backend with first-class routing, validation, and identity.', alts:['Blazor if you want interactive UI in C#','Laravel or Django if willing to learn a new language','For desktop, C# + WPF or MAUI'] };
      }
      if (exp === 'java') {
        return { title: 'Java + Spring Boot', why:'The standard framework for Java web applications with strong tooling.', alts:['Javalin or Spark for small projects','PHP, Django, or Node may be more efficient if learning anyway','For desktop, Java + JavaFX'] };
      }
      return { title: 'PHP + MySQL (server-rendered)', why:'For a project with no unusual requirements, this is the fastest path to a working system.', alts:['Python + Flask or Django if you prefer Python','Framework (Laravel, Django) if you would rebuild auth and validation','Avoid SPA frameworks unless truly needed'] };
    }

const STORAGE = {
  visited: 'pl_visited',
  toolProgress: 'pl_tool_',
  bookmarks: 'pl_bookmarks',
  visitCount: 'pl_visit_count',
  contact: 'pl_contact',
  downloads: 'pl_downloads_custom',
  isAdmin: 'pl_admin_mode',
};
function getStoredVisited(){try{return JSON.parse(localStorage.getItem(STORAGE.visited)||'[]')}catch(e){return[]}}
function recordVisit(name,href,type){try{const list=getStoredVisited().filter(v=>v.href!==href);list.unshift({name,href,type:type||'page',at:Date.now()});localStorage.setItem(STORAGE.visited,JSON.stringify(list.slice(0,8)))}catch(e){}}
function clearVisited(){try{localStorage.removeItem(STORAGE.visited)}catch(e){}}
function getVisitCount(href){try{const all=JSON.parse(localStorage.getItem(STORAGE.visitCount)||'{}');return all[href]||0}catch(e){return 0}}
function incrementVisitCount(href){try{const all=JSON.parse(localStorage.getItem(STORAGE.visitCount)||'{}');all[href]=(all[href]||0)+1;localStorage.setItem(STORAGE.visitCount,JSON.stringify(all))}catch(e){}}
function isTrending(href,t){return getVisitCount(href)>=(t||2)}
function loadToolProgress(slug){try{return JSON.parse(localStorage.getItem(STORAGE.toolProgress+slug)||'{}')}catch(e){return{}}}
function saveToolProgress(slug,data){try{localStorage.setItem(STORAGE.toolProgress+slug,JSON.stringify(data))}catch(e){}}
function getBookmarks(){try{return JSON.parse(localStorage.getItem(STORAGE.bookmarks)||'[]')}catch(e){return[]}}
function toggleBookmark(entry){let list=getBookmarks();const idx=list.findIndex(b=>b.href===entry.href);if(idx>=0)list.splice(idx,1);else list.unshift({...entry,at:Date.now()});list=list.slice(0,20);try{localStorage.setItem(STORAGE.bookmarks,JSON.stringify(list))}catch(e){}return list}
function getCustomDownloads(){try{return JSON.parse(localStorage.getItem(STORAGE.downloads)||'[]')}catch(e){return[]}}
function saveCustomDownload(dl){const list=getCustomDownloads();list.push({...dl,id:'custom-' + Date.now()});try{localStorage.setItem(STORAGE.downloads,JSON.stringify(list))}catch(e){}return list}
function removeCustomDownload(id){const list=getCustomDownloads().filter(d=>d.id!==id);try{localStorage.setItem(STORAGE.downloads,JSON.stringify(list))}catch(e){}return list}
function getAllDownloads(){return [...getCustomDownloads(), ...SEED_DOWNLOADS]}
function isAdmin(){try{return localStorage.getItem(STORAGE.isAdmin)==='true'}catch(e){return false}}
function setAdmin(v){try{if(v)localStorage.setItem(STORAGE.isAdmin,'true');else localStorage.removeItem(STORAGE.isAdmin)}catch(e){}}

const $=(s,r=document)=>r.querySelector(s);

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function toast(title,text,type){
  const stack=$('#toast-stack');if(!stack)return;type=type||'info';
  const iconSvg=type==='wa'?iconFill('whatsapp',16):icon(type==='success'?'check':type==='error'?'shield':'check');
  const el=document.createElement('div');el.className='toast '+type;el.setAttribute('role','status');
  el.innerHTML='<span class="toast-icon">'+iconSvg+'</span><div class="toast-body"><div class="toast-title">'+esc(title)+'</div>'+(text?'<div class="toast-text">'+esc(text)+'</div>':'')+'</div><button class="toast-close" type="button" aria-label="Dismiss"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>';
  stack.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  const close=()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)};
  el.querySelector('.toast-close').addEventListener('click',close);setTimeout(close,5000);
}
function copyToClipboard(text,btn){
  const done=()=>{if(btn){btn.classList.add('copied');setTimeout(()=>btn.classList.remove('copied'),1600)}toast('Copied',text.length>60?text.slice(0,60)+'…':text,'success')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done).catch(()=>{legacyCopy(text);done()});
  else{legacyCopy(text);done()}
}
function legacyCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}

function downloadAsFile(content,filename,mimeType){
  const blob=new Blob([content],{type:mimeType||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

/* ============================================================
   BLOCKS
   ============================================================ */
function renderBlock(b){
  switch(b.t){
    case'p':return'<p>'+esc(b.text)+'</p>';
    case'h3':return'<h3>'+esc(b.text)+'</h3>';
    case'ul':return'<ul>'+b.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
    case'ol':return'<ol>'+b.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ol>';
    case'code':return'<pre><div class="pre-head"><span>'+esc(b.filename||b.lang)+'</span><span>'+esc(b.lang)+'</span></div><code>'+highlight(b.code)+'</code></pre>';
    case'callout':return'<div class="callout '+b.variant+'"><div class="callout-title">'+esc(b.title)+'</div><p>'+esc(b.text)+'</p></div>';
    case'table':return'<div class="table-wrap"><table><thead><tr>'+b.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    default:return'';
  }
}
function renderSections(sections){return sections.map(s=>'<section id="'+s.id+'"><h2>'+esc(s.title)+'</h2>'+s.blocks.map(renderBlock).join('')+'</section>').join('')}
function renderViva(viva){
  if(!viva||!viva.length)return'';
  return'<section id="viva"><h2>Viva preparation questions</h2><div class="viva-list">'+viva.map(v=>'<div class="viva"><div class="viva-q">'+esc(v.q)+'</div><div class="viva-a">'+esc(v.a)+'</div></div>').join('')+'</div></section>';
}
function renderTOC(sections,hasViva){
  const items=sections.map(s=>'<li><a href="#'+s.id+'">'+esc(s.title)+'</a></li>').join('')+(hasViva?'<li><a href="#viva">Viva questions</a></li>':'');
  return'<div class="toc" id="toc"><button class="toc-header" id="toc-header" aria-expanded="false" aria-controls="toc-list"><h2>On this page</h2><span class="toc-chevron">'+icon('chevron')+'</span></button><div class="toc-list" id="toc-list"><div class="toc-list-inner"><ol>'+items+'</ol></div></div></div>';
}

/* ============================================================
   SEARCH SUGGESTIONS
   ============================================================ */
function getSearchIndex(){
  const index=[];
  PROJECTS.forEach(p=>index.push({type:'Project',title:p.title,sub:p.category+' · '+p.type,href:'#/projects/'+p.slug,keywords:(p.title+' '+p.summary+' '+p.technologies.join(' ')).toLowerCase()}));
  ARTICLES.forEach(a=>index.push({type:'Tutorial',title:a.title,sub:a.category,href:'#/tutorials/'+a.categoryId+'/'+a.slug,keywords:(a.title+' '+a.excerpt+' '+a.category).toLowerCase()}));
  TECHNOLOGIES.forEach(t=>index.push({type:'Technology',title:t.name,sub:t.tagline,href:'#/technologies/'+t.slug,keywords:(t.name+' '+t.tagline+' '+t.summary).toLowerCase()}));
  TOOLS.forEach(t=>index.push({type:'Tool',title:t.name,sub:t.category,href:'#/tools/'+t.slug,keywords:(t.name+' '+t.summary).toLowerCase()}));
  getAllDownloads().forEach(d=>index.push({type:'Download',title:d.title,sub:d.category,href:'#/downloads',keywords:(d.title+' '+(d.description||'')).toLowerCase()}));
  return index;
}
function searchSuggestions(q,limit){
  if(!q||q.length<1)return[];
  const ql=q.toLowerCase().trim();
  const idx=getSearchIndex();
  const scored=idx.map(item=>{
    let score=0;const t=item.title.toLowerCase();
    if(t===ql)score+=100;if(t.startsWith(ql))score+=50;if(t.includes(ql))score+=20;if(item.keywords.includes(ql))score+=5;
    return{...item,score};
  }).filter(i=>i.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit||6);
}
function wireSearchSuggest(){
  const wrap=$('.hero-search-wrap');if(!wrap)return;
  const input=wrap.querySelector('input[name="q"]');const box=wrap.querySelector('.search-suggest');
  if(!input||!box)return;let focusIdx=-1;let currentItems=[];
  const hide=()=>{box.classList.remove('show');focusIdx=-1;currentItems=[]};
  const render=(items)=>{
    currentItems=items;
    if(!items.length){box.innerHTML='<div class="ss-empty">No matches. Press Enter to search the project directory.</div>'}
    else{box.innerHTML='<div class="ss-label">Matches</div>'+items.map((it,i)=>'<a href="'+it.href+'" data-idx="'+i+'" class="'+(i===focusIdx?'focused':'')+'"><span class="ss-icon">'+icon(it.type==='Project'?'doc':it.type==='Tutorial'?'book':it.type==='Technology'?'layers':it.type==='Download'?'download':'wand')+'</span><span class="ss-body"><span class="ss-title">'+esc(it.title)+'</span><span class="ss-meta">'+esc(it.type)+' · '+esc(it.sub)+'</span></span><span class="ss-arrow">'+icon('arrow')+'</span></a>').join('')}
    box.classList.add('show');
  };
  input.addEventListener('input',()=>{const v=input.value.trim();if(!v){hide();return}const items=searchSuggestions(v,6);focusIdx=-1;render(items)});
  input.addEventListener('focus',()=>{const v=input.value.trim();if(v){const items=searchSuggestions(v,6);focusIdx=-1;render(items)}});
  input.addEventListener('keydown',(e)=>{
    if(!box.classList.contains('show'))return;
    if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,currentItems.length-1);$$('.search-suggest a',box).forEach((a,i)=>a.classList.toggle('focused',i===focusIdx))}
    else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,-1);$$('.search-suggest a',box).forEach((a,i)=>a.classList.toggle('focused',i===focusIdx))}
    else if(e.key==='Enter'&&focusIdx>=0){e.preventDefault();const href=currentItems[focusIdx].href;hide();location.hash=href}
    else if(e.key==='Escape'){hide()}
  });
  document.addEventListener('click',(e)=>{if(!wrap.contains(e.target))hide()});
  box.addEventListener('click',(e)=>{const a=e.target.closest('a');if(a)hide()});
}

function dlCard(d){
  const ft=(d.filetype||'md').toLowerCase();

  return(

      '<div class="dl-card-head"><div class="dl-icon '+ft+'">'+iconLabel+'</div><div class="dl-card-body"><div class="dl-card-title">'+esc(d.title)+'</div><p class="dl-card-desc">'+esc(d.description||'')+'</p><div class="dl-card-meta">'+(d.category?'<span>'+esc(d.category)+'</span><span class="dot"></span>':'')+(d.size?'<span>'+esc(d.size)+'</span>':'')+(d.updated?'<span class="dot"></span><span>'+formatDate(d.updated)+'</span>':'')+'</div></div></div>'+

function breadcrumbs(items){
  const all=[{name:'Home',href:'#/'},...items];
  return'<div class="container"><nav class="breadcrumbs" aria-label="Breadcrumb">'+all.map((c,i)=>{const last=i===all.length-1;return last?'<span class="current" aria-current="page">'+esc(c.name)+'</span>':'<a href="'+c.href+'">'+esc(c.name)+'</a><span class="sep">/</span>'}).join('')+'</nav></div>';
}

/* ============================================================
   PROJECTS DIRECTORY
   ============================================================ */
function viewProjectsDirectory(query){
  const q=(query.q||'').toLowerCase().trim();
  const cat=query.cat||'',tech=query.tech||'',type=query.type||'',sort=query.sort||'recent';
  let list=PROJECTS.slice();
  if(q)list=list.filter(p=>p.title.toLowerCase().includes(q)||p.summary.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.technologies.some(t=>t.toLowerCase().includes(q)));
  if(cat)list=list.filter(p=>p.category===cat);
  if(tech)list=list.filter(p=>p.technologies.includes(tech));
  if(type)list=list.filter(p=>p.type===type);
  if(sort==='title')list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(sort==='updated')list.sort((a,b)=>(a.updated<b.updated?1:-1));
  else list.sort((a,b)=>(a.published<b.published?1:-1));
  const allCats=Array.from(new Set(PROJECTS.map(p=>p.category)));
  const allTechs=Array.from(new Set(PROJECTS.flatMap(p=>p.technologies))).sort();
  const fp=(k,v)=>{const p=new URLSearchParams(query);if(v)p.set(k,v);else p.delete(k);const s=p.toString();return'#/projects'+(s?'?'+s:'')};

  return(
    '<section class="dir-header"><div class="container"><div class="eyebrow accent">Project directory</div><h1 style="margin-top:12px">Project guides</h1><p>Every guide is a working reference: scope, users, architecture, data model, implementation walkthrough, testing checklist, and viva questions. Filter by category or technology.</p></div></section>'+
    '<div class="filters-sticky"><div class="container">'+
      '<div class="filter-search">'+
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>'+
        '<input id="dir-search" type="search" placeholder="Search by title, description, or technology…" value="'+esc(query.q||'')+'" aria-label="Search projects" />'+
      '</div>'+
      '<div class="filter-row">'+
        '<div class="filter-group"><span class="filter-label">Category</span>'+
          '<a class="chip'+(cat?'':' active')+'" href="'+fp('cat','')+'">All</a>'+
          allCats.map(c=>'<a class="chip'+(cat===c?' active':'')+'" href="'+fp('cat',c)+'">'+esc(c)+'</a>').join('')+
        '</div>'+
        '<div class="filter-group"><span class="filter-label">Technology</span>'+
          '<a class="chip'+(tech?'':' active')+'" href="'+fp('tech','')+'">All</a>'+
          allTechs.map(t=>'<a class="chip'+(tech===t?' active':'')+'" href="'+fp('tech',t)+'">'+esc(t)+'</a>').join('')+
        '</div>'+
        ((q||cat||tech||type)?'<a class="filter-reset" href="#/projects">Reset all filters</a>':'')+
      '</div>'+
    '</div></div>'+
    '<section style="padding-top:32px"><div class="container">'+
      '<div class="results-bar"><span class="results-count"><strong>'+list.length+'</strong> '+(list.length===1?'project':'projects')+'</span>'+(q?'<span>Search: "'+esc(q)+'"</span>':'')+'</div>'+
      (list.length
        ?'<div class="project-grid">'+list.map(projectCard).join('')+'</div>'
        :'<div class="empty-state"><h3>No projects match your filters</h3><p>Try removing a filter or searching for a broader term.</p><a href="#/projects" class="btn btn-primary">Reset all filters</a></div>')+
    '</div></section>'
  );
}

function viewTool(slug){
  const t=TOOLS.find(x=>x.slug===slug);if(!t)return view404();
  let bodyHtml='';
  if(t.type==='checklist')bodyHtml=renderChecklistTool(t);
  else if(t.type==='wizard')bodyHtml=renderWizardTool(t);
  else if(t.type==='erd')bodyHtml=renderErdTool(t);
  else if(t.type==='questionbank')bodyHtml=renderQuestionBankTool(t);
  else bodyHtml='<div class="prose"><p>Content coming soon.</p></div>';

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [pathPart,queryPart]=raw.split('?');
  const path=pathPart.replace(/\/+$/,'')||'/';
  const query={};
  if(queryPart)new URLSearchParams(queryPart).forEach((v,k)=>{query[k]=v});
  const segments=path.split('/').filter(Boolean);
  return{path,segments,query};
}
function route(){
  const {segments,query}=parseHash();
  const [a,b,c]=segments;
  if(!a)return{name:'home',html:viewHome()};
  if(a==='projects'&&!b)return{name:'projects',html:viewProjectsDirectory(query)};
  if(a==='projects'&&b){const p=PROJECTS.find(x=>x.slug===b);return{name:'project',project:p,html:viewProject(b)}}
  if(a==='tutorials'&&!b)return{name:'tutorials',html:viewTutorials()};
  if(a==='tutorials'&&b&&!c){const cat=TUT_CATEGORIES.find(x=>x.id===b);return{name:'tutorial-category',category:cat,html:viewTutorialCategory(b)}}
  if(a==='tutorials'&&b&&c){const art=ARTICLES.find(x=>x.slug===c&&x.categoryId===b);return{name:'article',article:art,html:viewArticle(b,c)}}
  if(a==='technologies'&&!b)return{name:'technologies',html:viewTechnologies()};
  if(a==='technologies'&&b){const t=TECHNOLOGIES.find(x=>x.slug===b);return{name:'technology',technology:t,html:viewTechnology(b)}}
  if(a==='tools'&&!b)return{name:'tools',html:viewTools()};
  if(a==='tools'&&b){const t=TOOLS.find(x=>x.slug===b);return{name:'tool',tool:t,html:viewTool(b)}}
  if(a==='downloads')return{name:'downloads',html:viewDownloads(query)};
  if(a==='about')return{name:'about',html:viewAbout()};
  if(a==='contact')return{name:'contact',html:viewContact()};
  if(a==='privacy')return{name:'privacy',html:viewPrivacy()};
  if(a==='terms')return{name:'terms',html:viewTerms()};
  if(a==='disclaimer')return{name:'disclaimer',html:viewDisclaimer()};
  return{name:'404',html:view404()};
}

function wireTOC(){
  const toc=$('#toc');const header=$('#toc-header');
  if(!toc||!header)return;
  const mq=window.matchMedia('(min-width:1024px)');
  const sync=()=>{if(mq.matches){toc.classList.add('open');header.setAttribute('aria-expanded','true')}};
  sync();mq.addEventListener('change',sync);
  header.addEventListener('click',()=>{if(mq.matches)return;const open=toc.classList.toggle('open');header.setAttribute('aria-expanded',open?'true':'false')});
  const links=$$('#toc-list a');if(!links.length||!('IntersectionObserver'in window))return;
  const targets=links.map(a=>document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){links.forEach(l=>l.classList.remove('active'));const link=links.find(l=>l.getAttribute('href')==='#'+entry.target.id);if(link)link.classList.add('active')}})},{rootMargin:'-80px 0px -70% 0px',threshold:0});
  targets.forEach(t=>obs.observe(t));
}
function wireFAQ(){$$('.faq-item').forEach(item=>{const btn=item.querySelector('.faq-q');if(!btn)return;btn.addEventListener('click',()=>{const open=item.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false')})})}
function wireContinueStrip(){const c=$('#continue-clear');if(c)c.addEventListener('click',()=>{clearVisited();const s=$('#continue-strip');if(s)s.remove();toast('Cleared','Recently viewed history cleared.','success')})}
function wireBookmarks(){
  document.addEventListener('click',(e)=>{
    const btn=e.target.closest('[data-bookmark]');if(!btn)return;e.preventDefault();
    try{
      const data=JSON.parse(btn.getAttribute('data-bookmark'));
      const saved=toggleBookmark(data);
      const isNow=saved.some(b=>b.href===data.href);
      btn.setAttribute('data-bookmarked',isNow?'true':'false');
      btn.innerHTML=isNow?iconFill('bookmarkFill',12)+' Saved':icon('bookmark')+' Save';
      toast(isNow?'Saved':'Removed',isNow?'Added to your saved items.':'Removed from saved.','success');
    }catch(err){}
  });
}
function wireDownloads(){
  const grid=$('#dl-grid');if(!grid)return;
  grid.addEventListener('click',(e)=>{
    const dlBtn=e.target.closest('[data-download]');
    if(dlBtn){
      const id=dlBtn.getAttribute('data-download');
      const d=getAllDownloads().find(x=>x.id===id);
      if(!d)return;
      if(d.content){
        const filename=d.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.'+(d.filetype||'md');
        const mime=d.filetype==='md'?'text/markdown':'text/plain';
        downloadAsFile(d.content,filename,mime);
        toast('Downloading',d.title+' has been saved to your device.','success');
      }else if(d.url){
        window.open(d.url,'_blank','noopener,noreferrer');
        toast('Opening',d.title,'success');
      }
    }
    const rmBtn=e.target.closest('[data-dl-remove]');
    if(rmBtn){
      const id=rmBtn.getAttribute('data-dl-remove');
      if(!confirm('Remove this download?'))return;
      removeCustomDownload(id);
      toast('Removed','Custom download removed.','success');
      render();
    }
  });
  const input=$('#dl-search-input');
  if(input){
    let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const v=input.value.trim();const {query}=parseHash();const p=new URLSearchParams(query);if(v)p.set('q',v);else p.delete('q');const s=p.toString();history.replaceState(null,'','#/downloads'+(s?'?'+s:''));render()},300)});
  }
  $$('[data-dl-cat]').forEach(chip=>chip.addEventListener('click',()=>{
    const c=chip.getAttribute('data-dl-cat');
    const {query}=parseHash();const p=new URLSearchParams(query);

    const s=p.toString();
    location.hash='#/downloads'+(s?'?'+s:'');
  }));
  const addBtn=$('#admin-add-dl');
  if(addBtn)addBtn.addEventListener('click',()=>openAdminModal());
  const exitBtn=$('#admin-exit');
  if(exitBtn)exitBtn.addEventListener('click',()=>{setAdmin(false);toast('Admin off','Admin mode disabled.','success');render()});
}
function wireAdminModal(){

  const close=()=>modal.classList.remove('show');

  const cancelBtn=$('#admin-cancel');if(cancelBtn)cancelBtn.addEventListener('click',close);

    e.preventDefault();

function openAdminModal(){const modal=$('#admin-modal');if(modal)modal.classList.add('show')}

function rerenderDirectory(){

  const main=$('#main');if(!main)return;

  main.innerHTML=viewProjectsDirectory(query);
  const nw=$('#dir-search');

function wireContactForm(){
  const form=$('#contact-form');if(!form)return;
  try{const saved=JSON.parse(localStorage.getItem(STORAGE.contact)||'{}');if(saved.name&&!form.name.value)form.name.value=saved.name;if(saved.email&&!form.email.value)form.email.value=saved.email}catch(e){}
  const msg=form.message;const counter=$('#cf-msg-count');
  if(msg&&counter){const upd=()=>counter.textContent=msg.value.length;msg.addEventListener('input',upd);upd()}
  ['name','email','message'].forEach(name=>{
    const field=form.querySelector('[name="'+name+'"]');if(!field)return;
    field.addEventListener('blur',()=>validateField(field));
    field.addEventListener('input',()=>{if(field.closest('.form-field').classList.contains('error'))validateField(field)});
  });
  function validateField(field){
    const wrap=field.closest('.form-field');if(!wrap)return true;
    let valid=true;const val=field.value.trim();
    if(field.hasAttribute('required')&&!val)valid=false;
    else if(field.type==='email'&&val&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))valid=false;
    else if(field.name==='name'&&val&&val.length<2)valid=false;
    else if(field.name==='message'&&val&&val.length<10)valid=false;
    wrap.classList.toggle('error',!valid);return valid;
  }
  function validateForm(){return['name','email','message'].map(n=>{const f=form.querySelector('[name="'+n+'"]');return f?validateField(f):true}).every(Boolean)}
  function buildMessage(d){return'*New message from ProjectLab*\n\n*Name:* '+d.name+'\n*Email:* '+d.email+'\n*Topic:* '+d.topic+'\n\n*Message:*\n'+d.message}
  form.addEventListener('submit',(e)=>{
    e.preventDefault();const submitter=e.submitter;const action=(submitter&&submitter.dataset.action)||'whatsapp';
    if(!validateForm()){const first=form.querySelector('.form-field.error input, .form-field.error textarea');if(first)first.focus();toast('Fix highlighted fields','Some required information is missing.','error');return}
    const data={name:form.name.value.trim(),email:form.email.value.trim(),topic:form.topic.value,message:form.message.value.trim()};
    try{localStorage.setItem(STORAGE.contact,JSON.stringify({name:data.name,email:data.email}))}catch(e){}
    if(action==='whatsapp'){window.open(waUrl(buildMessage(data)),'_blank','noopener,noreferrer');toast('Opening WhatsApp…','Your message is ready to send.','wa')}
    else{const s='[ProjectLab] '+data.topic+' — from '+data.name;const b='Name: '+data.name+'\nEmail: '+data.email+'\nTopic: '+data.topic+'\n\n'+data.message;window.location.href='mailto:'+PL_CONFIG.email+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);toast('Opening email…','Your message is ready to send.','success')}
  });
}
function wireChecklistTool(){
  const body=$('#chk-body');if(!body)return;
  const slug=location.hash.replace('#/tools/','').replace(/[?\/].*$/,'');
  const progress=loadToolProgress(slug);
  function updateProgress(){const all=$$('input[data-chk]',body);const checked=all.filter(c=>c.checked).length;const pct=all.length?Math.round((checked/all.length)*100):0;const fill=$('#chk-fill');const pctEl=$('#chk-pct');if(fill)fill.style.width=pct+'%';if(pctEl)pctEl.textContent=pct+'%'}
  body.addEventListener('change',(e)=>{const chk=e.target.closest('input[data-chk]');if(!chk)return;const id=chk.getAttribute('data-chk');chk.closest('.chk-item').classList.toggle('checked',chk.checked);progress[id]=chk.checked;saveToolProgress(slug,progress);updateProgress()});
  const reset=$('#chk-reset');if(reset)reset.addEventListener('click',()=>{if(!confirm('Reset all progress for this checklist?'))return;$$('input[data-chk]',body).forEach(c=>{c.checked=false;c.closest('.chk-item').classList.remove('checked')});saveToolProgress(slug,{});updateProgress();toast('Reset','Progress cleared.','success')});
  const exp=$('#chk-export');if(exp)exp.addEventListener('click',()=>{const lines=[];$$('.chk-group',body).forEach(g=>{const gt=g.querySelector('h3').textContent;lines.push('\n## '+gt);$$('.chk-item',g).forEach(it=>{const chk=it.querySelector('input');const title=it.querySelector('.chk-item-title').textContent;lines.push((chk.checked?'[x] ':'[ ] ')+title)})});copyToClipboard(lines.join('\n'),exp)});
  updateProgress();
}
function wireQuestionBankTool(){
  const body=$('#qb-body');if(!body)return;
  const slug=location.hash.replace('#/tools/','').replace(/[?\/].*$/,'');
  const progress=loadToolProgress(slug);
  function updateProgress(){const all=$$('input[data-qb]',body);const checked=all.filter(c=>c.checked).length;const pct=all.length?Math.round((checked/all.length)*100):0;const fill=$('#qb-fill');const pctEl=$('#qb-pct');if(fill)fill.style.width=pct+'%';if(pctEl)pctEl.textContent=pct+'%'}
  body.addEventListener('change',(e)=>{const chk=e.target.closest('input[data-qb]');if(!chk)return;const id=chk.getAttribute('data-qb');chk.closest('.chk-item').classList.toggle('checked',chk.checked);progress[id]=chk.checked;saveToolProgress(slug,progress);updateProgress()});
  const reset=$('#qb-reset');if(reset)reset.addEventListener('click',()=>{if(!confirm('Reset all progress?'))return;$$('input[data-qb]',body).forEach(c=>{c.checked=false;c.closest('.chk-item').classList.remove('checked')});saveToolProgress(slug,{});updateProgress();toast('Reset','Progress cleared.','success')});
  updateProgress();
}
function wireWizardTool(){
  const steps=$$('.wiz-step');if(!steps.length)return;
  const dots=$$('#wiz-progress .wiz-dot');const nav=$('#wiz-nav');const resultEl=$('#wiz-result');const backBtn=$('#wiz-back');const restartBtn=$('#wiz-restart');
  const slug=location.hash.replace('#/tools/','').replace(/[?\/].*$/,'');
  const tool=TOOLS.find(t=>t.slug===slug);if(!tool)return;
  const answers={};let current=0;
  function updateProgress(){dots.forEach((d,i)=>{d.classList.remove('active','done');if(i<current)d.classList.add('done');if(i===current)d.classList.add('active')})}
  function showStep(i){steps.forEach((s,idx)=>s.classList.toggle('active',idx===i));current=i;updateProgress();if(i>=steps.length){const rec=tool.recommend(answers);resultEl.style.display='block';resultEl.innerHTML='<div class="wiz-result"><div class="lbl">Recommended stack</div><div class="big">'+esc(rec.title)+'</div><p class="why">'+esc(rec.why)+'</p><div class="alts"><h4>Alternatives and cautions</h4><ul>'+rec.alts.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div></div>';resultEl.scrollIntoView({behavior:'smooth',block:'start'})}else{resultEl.style.display='none'}if(nav)nav.style.display='flex';backBtn.disabled=current===0}
  document.addEventListener('click',(e)=>{const opt=e.target.closest('.wiz-option');if(!opt)return;answers[opt.getAttribute('data-q')]=opt.getAttribute('data-val');$$('.wiz-option',opt.parentElement).forEach(o=>o.classList.remove('selected'));opt.classList.add('selected');setTimeout(()=>showStep(current+1),180)});
  backBtn.addEventListener('click',()=>{if(current>0)showStep(current-1)});
  restartBtn.addEventListener('click',()=>{Object.keys(answers).forEach(k=>delete answers[k]);$$('.wiz-option').forEach(o=>o.classList.remove('selected'));resultEl.style.display='none';showStep(0)});
  showStep(0);
}
function wireErdTool(){
  const scenarios=$$('.erd-scenario');if(!scenarios.length)return;
  const dots=$$('#erd-progress .wiz-dot');const prevBtn=$('#erd-prev');const nextBtn=$('#erd-next');const counter=$('#erd-counter');
  const slug=location.hash.replace('#/tools/','').replace(/[?\/].*$/,'');
  const tool=TOOLS.find(t=>t.slug===slug);if(!tool)return;
  let current=0;
  function updateNav(){scenarios.forEach((s,i)=>s.style.display=i===current?'block':'none');dots.forEach((d,i)=>{d.classList.remove('active','done');if(i<current)d.classList.add('done');if(i===current)d.classList.add('active')});if(counter)counter.textContent=(current+1)+' / '+scenarios.length;if(prevBtn)prevBtn.disabled=current===0;if(nextBtn)nextBtn.disabled=current===scenarios.length-1}
  scenarios.forEach((scenario,sidx)=>{const answers=$$('.erd-answer',scenario);const feedback=scenario.querySelector('.erd-feedback');
    answers.forEach(btn=>btn.addEventListener('click',()=>{
      const isCorrect=btn.getAttribute('data-correct')==='true';
      const ansKey=btn.getAttribute('data-ans');
      const ansData=tool.scenarios[sidx].answers.find(a=>a.key===ansKey);
      answers.forEach(b=>b.style.opacity='.5');
      btn.style.opacity='1';
      btn.style.borderColor=isCorrect?'var(--teal)':'var(--amber)';
      feedback.className='erd-feedback show '+(isCorrect?'correct':'wrong');
      feedback.innerHTML='<h4>'+(isCorrect?'Correct':'Not quite')+'</h4><p>'+esc(ansData.explanation)+'</p>'+(isCorrect?'':'<p style="margin-top:10px"><strong>The correct answer:</strong> '+esc(tool.scenarios[sidx].answers.find(a=>a.correct).title)+'</p>');
    }));
  });
  prevBtn.addEventListener('click',()=>{if(current>0){current--;updateNav()}});
  nextBtn.addEventListener('click',()=>{if(current<scenarios.length-1){current++;updateNav()}});
  updateNav();
}
function wireToolsDirectory(){
  const grid=$('#tools-grid');if(!grid)return;
  const input=$('#tools-search-input');const chips=$$('.tool-cat-chip');const empty=$('#tools-empty');let activeCat='';
  function filter(){const q=(input?input.value:'').trim().toLowerCase();let visible=0;$$('.tool-card',grid).forEach(card=>{const name=card.querySelector('.tool-name').textContent.toLowerCase();const sum=card.querySelector('.tool-sum').textContent.toLowerCase();const cat=card.querySelector('.tool-cat').textContent.trim();const mQ=!q||name.includes(q)||sum.includes(q);const mC=!activeCat||cat===activeCat;const show=mQ&&mC;card.style.display=show?'flex':'none';if(show)visible++});if(empty)empty.style.display=visible===0?'block':'none'}
  if(input)input.addEventListener('input',filter);
  chips.forEach(chip=>chip.addEventListener('click',()=>{chips.forEach(c=>c.classList.remove('active'));chip.classList.add('active');activeCat=chip.getAttribute('data-cat');filter()}));
}

function render(){
  const r=route();
  $('#main').innerHTML=r.html;
  renderChrome(r);
  renderFooter();
  updateSeo(r);
  wireDirectory();
  wireTOC();
  wireFAQ();
  wireContactForm();
  wireContinueStrip();
  wireChecklistTool();
  wireQuestionBankTool();
  wireWizardTool();
  wireErdTool();
  wireToolsDirectory();
  wireSearchSuggest();
  wireDownloads();
  wireAdminModal();
  if(r.name==='project'&&r.project){recordVisit(r.project.title,'#/projects/'+r.project.slug,'Project');incrementVisitCount('#/projects/'+r.project.slug)}
  else if(r.name==='article'&&r.article){recordVisit(r.article.title,'#/tutorials/'+r.article.categoryId+'/'+r.article.slug,'Tutorial');incrementVisitCount('#/tutorials/'+r.article.categoryId+'/'+r.article.slug)}
  else if(r.name==='tool'&&r.tool){recordVisit(r.tool.name,'#/tools/'+r.tool.slug,'Tool');incrementVisitCount('#/tools/'+r.tool.slug)}
  $('#mobile-nav').classList.remove('open');
  $('#menu-btn').setAttribute('aria-expanded','false');$('#menu-btn').setAttribute('aria-label','Open menu');
  $('#menu-icon').innerHTML='<path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  document.body.classList.remove('no-scroll');
  updateProgress();
  const hash=location.hash;
  const anchorMatch=hash.match(/#\/[^#]*#([\w-]+)/);
  if(anchorMatch){const el=document.getElementById(anchorMatch[1]);if(el){setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50);return}}
  window.scrollTo(0,0);
}
function updateProgress(){
  const doc=document.documentElement;const st=window.scrollY||doc.scrollTop;const h=doc.scrollHeight-doc.clientHeight;const pct=h>0?(st/h)*100:0;
  const fill=$('#progress-fill');if(fill)fill.style.width=pct+'%';
  const btn=$('#back-to-top');if(btn)btn.classList.toggle('show',st>600);
}
let ticking=false;
window.addEventListener('scroll',()=>{if(!ticking){window.requestAnimationFrame(()=>{updateProgress();const header=$('#site-header');const isHero=(location.hash===''||location.hash==='#/'||location.hash==='#');header.classList.toggle('on-hero',isHero&&window.scrollY<=8);header.classList.toggle('scrolled',!isHero||window.scrollY>8);ticking=false});ticking=true}},{passive:true});
$('#back-to-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

$('#menu-btn').addEventListener('click',()=>{
  const btn=$('#menu-btn');const nav=$('#mobile-nav');const open=nav.classList.toggle('open');
  btn.setAttribute('aria-expanded',open?'true':'false');btn.setAttribute('aria-label',open?'Close menu':'Open menu');
  $('#menu-icon').innerHTML=open?'<path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>':'<path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  document.body.classList.toggle('no-scroll',open);
});

document.addEventListener('click',(e)=>{
  const btn=e.target.closest('.copy-btn');
  if(btn){const text=btn.getAttribute('data-copy');if(text)copyToClipboard(text,btn);return}
  const share=e.target.closest('[data-share-url]');
  if(share){const url=share.getAttribute('data-share-url');copyToClipboard(url,share);return}
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();const s=$('#dir-search')||document.querySelector('.hero-search input');if(s){s.focus();if(s.value)s.dispatchEvent(new Event('input'))}else location.hash='#/projects'}
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'&&location.hash.startsWith('#/downloads')){e.preventDefault();setAdmin(true);toast('Admin on','Admin mode enabled.','success');render()}
});

window.addEventListener('hashchange',render);
render();
updateProgress();
</script>
